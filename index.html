<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anand Anilkumar | Creative Director &amp; Creative Producer</title>
  <meta name="description" content="Portfolio of Anand Anilkumar - UAE-based Creative Director &amp; Creative Producer with 10+ years across feature films, global advertising, branded documentaries, and digital creative." />
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #090a0d;
      --card-bg: #12151c;
      --card-hover: #181d27;
      --border: #222735;
      --border-light: rgba(255, 255, 255, 0.08);
      --accent: #d4a359;
      --accent-hover: #e6b368;
      --accent-glow: rgba(212, 163, 89, 0.16);
      --text: #f0f3f8;
      --muted: #9aa4b7;
      --max-width: 1180px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    h1, h2, h3, h4, .brand-font {
      font-family: 'Space Grotesk', sans-serif;
      letter-spacing: -0.02em;
    }

    a {
      color: inherit;
      text-decoration: none;
      transition: all 0.25s ease;
    }

    .container {
      width: 100%;
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 0 1.5rem;
    }

    /* Navigation Bar */
    nav {
      position: sticky;
      top: 0;
      z-index: 1000;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      background: rgba(9, 10, 13, 0.92);
      border-bottom: 1px solid var(--border);
    }
    .nav-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.9rem 0;
      gap: 1.5rem;
    }
    .logo {
      font-weight: 700;
      font-size: 1.08rem;
      letter-spacing: 0.03em;
      white-space: nowrap;
    }
    .logo span {
      color: var(--accent);
    }

    .nav-links {
      display: flex;
      gap: 1.5rem;
      list-style: none;
      font-size: 0.84rem;
      color: var(--muted);
      align-items: center;
    }
    .nav-links a:hover {
      color: #fff;
    }
    .nav-links li {
      display: flex;
      align-items: center;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    
    .btn-nav-download {
      padding: 0.4rem 0.9rem;
      border: 1px solid rgba(212, 163, 89, 0.5);
      border-radius: 999px;
      font-weight: 600;
      background: rgba(212, 163, 89, 0.08);
      color: var(--accent) !important;
      font-size: 0.78rem;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      transition: all 0.2s ease;
    }
    .btn-nav-download:hover {
      background: var(--accent);
      color: #090a0d !important;
      transform: translateY(-1px);
    }
    
    .btn-nav-hire {
      padding: 0.4rem 0.95rem;
      border: 1px solid var(--border);
      border-radius: 999px;
      font-weight: 600;
      background: var(--card-bg);
      color: var(--text) !important;
      font-size: 0.78rem;
      white-space: nowrap;
      transition: all 0.2s ease;
    }
    .btn-nav-hire:hover {
      border-color: var(--accent);
      color: var(--accent) !important;
      transform: translateY(-1px);
    }

    /* Fixed Mobile Drawer: Completely hidden by default on desktop */
    .mobile-drawer {
      display: none;
    }

    .mobile-menu-toggle {
      display: none;
      background: none;
      border: none;
      color: var(--text);
      cursor: pointer;
      padding: 0.5rem;
      z-index: 1002;
    }
    .mobile-menu-toggle span {
      display: block;
      width: 22px;
      height: 2px;
      background-color: currentColor;
      margin: 5px 0;
      transition: all 0.3s ease;
    }

    /* Section Global */
    section {
      padding: 4.8rem 0;
      border-bottom: 1px solid var(--border);
    }
    .section-head {
      margin-bottom: 2.4rem;
    }
    .section-eyebrow {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 0.35rem;
    }
    .section-title {
      font-size: 2rem;
      font-weight: 700;
    }
    .section-subtitle {
      color: var(--muted);
      font-size: 0.95rem;
      margin-top: 0.4rem;
      max-width: 680px;
    }

    /* 1. Hero & About Section */
    .hero {
      padding: 5rem 0 4.5rem;
      position: relative;
    }
    .hero-split {
      display: grid;
      grid-template-columns: 1fr;
      gap: 3rem;
      align-items: center;
    }
    @media (min-width: 900px) {
      .hero-split {
        grid-template-columns: 1.25fr 0.75fr;
      }
    }
    .hero-content {
      z-index: 2;
    }
    
    .hero-badge-strip {
      display: flex;
      flex-wrap: wrap;
